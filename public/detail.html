<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดสถานที่ท่องเที่ยว - วัดไทย</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 32px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #059669;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      color: #0f172a;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 20px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎉 เชื่อมโยงหน้าสำเร็จ! (detail.html)</div>
    <h1>รายละเอียด: วัดไทย</h1>
    <p>ยินดีด้วย! คุณได้สร้างลิงก์รูปภาพเชื่อมโยงมายังหน้า <code>detail.html</code> ได้ถูกต้องตามข้อกำหนดที่ 5 ของแบบฝึกหัดแล้ว</p>
    <a href="javascript:history.back()" class="btn">← ย้อนกลับไปหน้าหลัก</a>
  </div>
</body>
</html>
